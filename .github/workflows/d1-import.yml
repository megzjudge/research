name: D1 import SQL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run all scan files in order, or one file
        required: true
        default: all
        type: choice
        options:
          - block_004.sql
          - block_005.sql
          - block_006.sql
          - block_007.sql
          - block_008.sql
          - block_009.sql
          - block_010.sql
          - block_011.sql
          - block_012.sql
          - block_013.sql
          - block_014.sql
          - block_015.sql
          - block_016.sql
          - block_017.sql
          - block_018.sql
          - block_019.sql
          - block_020.sql
          - block_021.sql
          - block_022.sql
          - block_023.sql
          - block_024.sql
          - block_025.sql

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing secret ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare credentials are set."

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run all scan files (scan_1 → scan_7)
        if: inputs.mode == 'all'
        run: |
          set -euo pipefail
          for f in scan_1.sql scan_2.sql scan_3.sql scan_6.sql scan_7.sql; do
            if [[ ! -f "$f" ]]; then
              echo "Missing $f — add it to the repo root and re-run."
              exit 1
            fi
            echo "=== Running $f ==="
            wrangler d1 execute research --remote --file="$f"
          done

      - name: Run single scan file
        if: inputs.mode != 'all'
        run: wrangler d1 execute research --remote --file="${{ inputs.mode }}"

      - name: Verify paper count
        run: wrangler d1 execute research --remote --command "SELECT COUNT(*) AS papers FROM papers;"
