<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Personal google scholar alerts for Megan Judge from studies on a range of topics." />
  <meta name="keywords" content="Read List, Bookmarks, Studies, Scholarly, Google Scholar, Articles, Links, Megan Judge" />
  <meta name="author" content="Megan Judge" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#f7a64b" />
  <meta property="og:title" content="Read List | Megan Judge" />
  <meta property="og:description" content="Personal google scholar alerts for Megan Judge from studies on a range of topics." />
  <meta property="og:url" content="https://research.jdge.cc/" />
  <meta property="og:image" content="/images/icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_AU" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/images/icon.png" />
  <meta name="twitter:image:alt" content="Read List" />
  <link rel="icon" type="image/png" href="/images/icon.png" />
  <link rel="canonical" href="https://research.jdge.cc/" />
  <link rel="alternate" href="https://research.jdge.cc/" hreflang="en" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
  
<body>
  <div class="layout">
    <aside class="rail">
      <p class="brand">Scholar Alerts New Papers Alerts<span class="dot">.</span></p>
      <p class="tagline">New papers across the trait taxonomies I track through Google Scholar Alerts.</p>
      <ul id="railnav" class="railnav"></ul>
      <div class="addbox">
        <input id="newtag" type="text" placeholder="add a construct…" autocomplete="off" />
        <button id="addbtn">add</button>
      </div>
      <p class="addhint">Creates an empty section now. Set the same name as your Scholar alert subject and its emails will land here.</p>
    </aside>

    <main class="content">
      <div class="searchwrap">
        <input id="q" class="search" type="search" placeholder="search all papers — titles, authors, abstracts…" autocomplete="off" />
      </div>
      <div id="sections"></div>
      <div id="status" class="statusline">loading…</div>
    </main>
  </div>

  <footer>
    (c) Megan Judge
  </footer>
  
  <script src="/script.js"></script>
  
</body>
</html>
